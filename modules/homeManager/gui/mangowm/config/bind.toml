[bind.default]

# menu and terminal
"SUPER+Return" = "spawn,$term"
"SUPER+d" = "spawn,rofi -config ~/.config/mango/rofi/config.rasi -show drun"

# kill or exit
# "SUPER+shift+e" = "quit"
"SUPER+shift+q" = "killclient,"

# switch window focus
# "SUPER+Tab" = "overcircle,next"
"ALT+Tab" = "togglejump"
"super+tab" = "focusstack,next"
"super+shift+tab" = "focusstack,last"
"ALT+Left" = "focusdir,left"
"ALT+Right" = "focusdir,right"
"ALT+Up" = "focusdir,up"
"ALT+Down" = "focusdir,down"

# swap window
"SUPER+SHIFT+Up" = "move_client,up"
"SUPER+SHIFT+Down" = "move_client,down"
"SUPER+SHIFT+Left" = "move_client,left"
"SUPER+SHIFT+Right" = "move_client,right"

# movewin
# "CTRL+SHIFT+Up" = "movewin,+0,-50"
# "CTRL+SHIFT+Down" = "movewin,+0,+50"
# "CTRL+SHIFT+Left" = "movewin,-50,+0"
# "CTRL+SHIFT+Right" = "movewin,+50,+0"

# resizewin
"CTRL+ALT+Up" = "resizewin,+0,-50"
"CTRL+ALT+Down" = "resizewin,+0,+50"
"CTRL+ALT+Left" = "resizewin,-50,+0"
"CTRL+ALT+Right" = "resizewin,+50,+0"

# switch window status
"SUPER+g" = "toggleglobal,"
"super+shift+f" = "togglefloating,"
"ALT+a" = "togglemaximizescreen,"
"super+f" = "togglefullscreen,"
# "ALT+SHIFT+f" = "togglefakefullscreen,"
"SUPER+i" = "minimized,"
"SUPER+o" = "toggleoverlay,"
"SUPER+SHIFT+I" = "restore_minimized"
"ALT+z" = "toggle_scratchpad"

# scroller layout
"ALT+e" = "set_proportion,1.0"
"ALT+x" = "switch_proportion_preset,"
"alt+super+ctrl+Left" = "scroller_stack,left"
"alt+super+ctrl+Right" = "scroller_stack,right"
"alt+super+ctrl+Up" = "scroller_stack,up"
"alt+super+ctrl+Down" = "scroller_stack,down"

#dwindle layout
"alt+shift+Return" = "dwindle_toggle_split_direction"

# tile layout
"SUPER+comma" = "incnmaster,1"
"SUPER+period" = "incnmaster,-1"
"Super+a" = "zoom,"

# switch layout
"CTRL+SUPER+i" = "setlayout,tile"
"CTRL+SUPER+m" = "setlayout,center_tile"
"SUPER+n" = "switch_layout"

# tag switch
"SUPER+Left" = "viewtoleft,0"
# "CTRL+Left" = "viewtoleft_have_client,0"
"SUPER+Right" = "viewtoright,0"
# "CTRL+Right" = "viewtoright_have_client,0"
"CTRL+SUPER+Left" = "tagtoleft,0"
"CTRL+SUPER+Right" = "tagtoright,0"
"Super+1" = "view,1,0"
"Super+2" = "view,2,0"
"Super+3" = "view,3,0"
"Super+4" = "view,4,0"
"Super+5" = "view,5,0"
"Super+6" = "view,6,0"
"Super+7" = "view,7,0"
"Super+8" = "view,8,0"
"Super+9" = "view,9,0"
"Super+Shift+1" = "tagsilent,1,0"
"Super+Shift+2" = "tagsilent,2,0"
"Super+Shift+3" = "tagsilent,3,0"
"Super+Shift+4" = "tagsilent,4,0"
"Super+Shift+5" = "tagsilent,5,0"
"Super+Shift+6" = "tagsilent,6,0"
"Super+Shift+7" = "tagsilent,7,0"
"Super+Shift+8" = "tagsilent,8,0"
"Super+Shift+9" = "tagsilent,9,0"
"ctrl+Super+1" = "toggletag,1"
"ctrl+Super+2" = "toggletag,2"
"ctrl+Super+3" = "toggletag,3"
"ctrl+Super+4" = "toggletag,4"
"ctrl+Super+5" = "toggletag,5"
"ctrl+Super+6" = "toggletag,6"
"ctrl+Super+7" = "toggletag,7"
"ctrl+Super+8" = "toggletag,8"
"ctrl+Super+9" = "toggletag,9"
"Super+Alt+1" = "toggleview,1"
"Super+Alt+2" = "toggleview,2"
"Super+Alt+3" = "toggleview,3"
"Super+Alt+4" = "toggleview,4"
"Super+Alt+5" = "toggleview,5"
"Super+Alt+6" = "toggleview,6"
"Super+Alt+7" = "toggleview,7"
"Super+Alt+8" = "toggleview,8"
"Super+Alt+9" = "toggleview,9"

# monitor switch
"alt+shift+Left" = "focusmon,left"
"alt+shift+Right" = "focusmon,right"
"alt+shift+Up" = "focusmon,up"
"alt+shift+Down" = "focusmon,down"
"SUPER+Alt+Left" = "tagmon,left"
"SUPER+Alt+Right" = "tagmon,right"
"SUPER+Alt+Up" = "tagmon,up"
"SUPER+Alt+Down" = "tagmon,down"

# gaps
"ALT+SHIFT+X" = "incgaps,1"
"ALT+SHIFT+Z" = "incgaps,-1"
"ALT+SHIFT+R" = "togglegaps"

# brightness and volume
"XF86AudioRaiseVolume" = "spawn,noctalia msg volume-up"
"XF86AudioLowerVolume" = "spawn,noctalia msg volume-down"
"XF86AudioMute" = "spawn,noctalia msg volume-mute"
"super+y" = "spawn,noctalia msg mic-mute"
"XF86MonBrightnessUp" = "spawn,noctalia msg brightness-up"
"XF86MonBrightnessDown" = "spawn,noctalia msg brightness-down"

# misc
"print" = "spawn,noctalia msg screenshot-fullscreen"
"shift+print" = "spawn,noctalia msg screenshot-region"
"ctrl+print" = "spawn,noctalia msg screenshot-window"
"super+c" = "spawn,noctalia msg panel-toggle clipboard"
"pause" = "spawn,noctalia msg session lock"

[bind.default.conflict]
"SUPER+r" = [
  # reload config
  "spawn_shell,notify-send 'config reload'",
  "reload_config",
]

[mousebind.default]

# Mouse Button Bindings
"SUPER+btn_left" = "moveresize,curmove"
"alt+btn_middle" = "set_proportion,0.5"
"SUPER+btn_right" = "moveresize,curresize"
"SUPER+CTRL+btn_left" = "minimized"
"SUPER+CTRL+btn_right" = "killclient"
"SUPER+CTRL+btn_middle" = "togglefullscreen"
# "btn_middle" = "togglemaximizescreen,0"

[axisbind.default]

# Axis Bindings
"SUPER+UP" = "viewtoleft_have_client"
"SUPER+DOWN" = "viewtoright_have_client"
"alt+UP" = "focusdir,left"
"alt+DOWN" = "focusdir,right"
"shift+super+UP" = "exchange_client,left"
"shift+super+DOWN" = "exchange_client,right"

[gesturebind.default]

# Gesturebind
"none+left+3" = "focusdir,left"
"none+right+3" = "focusdir,right"
"none+up+3" = "focusdir,up"
"none+down+3" = "focusdir,down"
"none+right+4" = "viewprev_have_client"
"none+left+4" = "viewnext_have_client"
"none+up+4" = "enteroverview"
"none+down+4" = "leaveoverview"
